name: Update uptime

on:
  schedule:
    - cron: "5 0 * * *" # Run daily at 00:05 UTC
  push:
    paths:
      - ".github/workflows/update-uptime.yml"
      - "scripts/update_uptime.py"
  workflow_dispatch: # Run manually from the Actions tab

jobs:
  update-uptime:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install python-dateutil

      - name: Update uptime field in SVG
        run: python scripts/update_uptime.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark-mode.svg
          git diff --staged --quiet || git commit -m "Update uptime"
          git push
